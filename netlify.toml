[build]
  command = "npm run build"

[build.environment]
  # Next.js 16 requires Node >= 20.9; pin explicitly so Netlify's build
  # image doesn't default to something older.
  NODE_VERSION = "20"

# Netlify auto-detects Next.js and installs its official Next.js Runtime
# (@netlify/plugin-nextjs) at build time — no [[plugins]] block needed and
# no manual "publish" directory: the runtime handles static + server output.
